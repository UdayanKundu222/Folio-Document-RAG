<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4efe4">
<title>Folio · Ask your documents</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%231f6f5c' d='M5 3h9l5 5v13H5z'/%3E%3C/svg%3E">
<style>
  :root {
    --paper: #f4efe4; --panel: #fffcf5; --ink: #22201b; --ink-2: #4a443a; --muted: #7a7062; --line: #e4dccb;
    --accent: #1f6f5c; --accent-ink: #175646; --accent-soft: #e2eee8;
    --cite: #a75d1a; --cite-soft: #f8ead9; --danger: #b3261e;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); line-height: 1.5; -webkit-text-size-adjust: 100%; }
  button, input, textarea, select { font: inherit; color: inherit; }
  .hidden { display: none !important; }

  .app { display: grid; grid-template-columns: 300px 1fr; height: 100dvh; }

  /* ---------- Sidebar: the "library" ---------- */
  .side { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .side-head { padding: 22px 20px 14px; }
  .logo { font-family: var(--serif); font-size: 26px; font-weight: 700; letter-spacing: -.01em; display: flex; align-items: center; gap: 10px; }
  .logo .mark { width: 30px; height: 36px; background: var(--accent); border-radius: 3px 10px 3px 3px; position: relative; }
  .logo .mark::after { content: ""; position: absolute; left: 7px; right: 7px; top: 11px; height: 2px; background: #fffcf5; box-shadow: 0 6px 0 #fffcf5, 0 12px 0 #fffcf5; opacity: .85; }
  .tagline { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .side-label { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); padding: 10px 20px 6px; }
  .shelf { list-style: none; margin: 0; padding: 0 10px; overflow-y: auto; flex: 1; min-height: 0; }
  .shelf li button { width: 100%; text-align: left; border: 0; background: transparent; padding: 10px 12px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .shelf li button:hover { background: #f6f0e3; }
  .shelf li button.active { background: var(--accent-soft); }
  .shelf .name { font-family: var(--serif); font-size: 16.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .shelf .n { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .shelf .empty-shelf { color: var(--muted); font-size: 14px; padding: 8px 12px; }

  .side-foot { border-top: 1px solid var(--line); padding: 16px 20px 20px; }
  .new-row { display: flex; gap: 8px; margin-bottom: 12px; }
  .new-row input { flex: 1; min-width: 0; border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 9px 11px; font-size: 14px; outline: none; }
  .new-row input:focus { border-color: var(--accent); }
  .drop { display: block; border: 1.5px dashed #cfc3ab; border-radius: 12px; padding: 14px; text-align: center; cursor: pointer; background: #fbf7ee; transition: background .15s, border-color .15s; }
  .drop:hover, .drop.over { background: var(--accent-soft); border-color: var(--accent); }
  .drop b { display: block; font-size: 14px; }
  .drop span { font-size: 12.5px; color: var(--muted); }
  .side-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; font-size: 12.5px; color: var(--muted); }
  .link-danger { border: 0; background: none; color: var(--danger); cursor: pointer; font-size: 12.5px; padding: 4px 0; }

  /* ---------- Main: the reading room ---------- */
  .main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .topbar { display: flex; align-items: center; gap: 12px; padding: 16px 28px; border-bottom: 1px solid var(--line); background: rgba(244, 239, 228, .92); backdrop-filter: blur(6px); }
  .menu-btn { display: none; border: 1px solid var(--line); background: var(--panel); width: 40px; height: 40px; border-radius: 10px; cursor: pointer; }
  .topbar h1 { margin: 0; font-family: var(--serif); font-size: 21px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .topbar .chip { font-size: 12px; color: var(--accent-ink); background: var(--accent-soft); padding: 3px 10px; border-radius: 99px; white-space: nowrap; }

  .thread { flex: 1; overflow-y: auto; padding: 28px 28px 12px; min-height: 0; }
  .thread-inner { max-width: 760px; margin: 0 auto; }
  .welcome { text-align: center; padding: 6vh 0 20px; }
  .welcome h2 { font-family: var(--serif); font-size: 32px; font-weight: 600; margin: 0 0 8px; letter-spacing: -.01em; }
  .welcome p { color: var(--muted); margin: 0 auto 22px; max-width: 460px; }

  .q { display: flex; justify-content: flex-end; margin: 18px 0 10px; }
  .q div { background: var(--ink); color: #fbf7ee; padding: 10px 15px; border-radius: 16px 16px 4px 16px; max-width: 80%; white-space: pre-wrap; word-wrap: break-word; }
  .a { margin: 4px 0 26px; }
  .a .who { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }
  .a .body { font-family: var(--serif); font-size: 18px; line-height: 1.65; white-space: pre-wrap; word-wrap: break-word; }
  .a .body.unknown { color: var(--muted); font-style: italic; }
  .cite { display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; padding: 0 5px; margin: 0 1px; border-radius: 6px; background: var(--cite-soft); color: var(--cite); font: 700 11.5px/1 var(--sans); vertical-align: 3px; cursor: pointer; border: 0; }
  .cite:hover, .cite.on { background: var(--cite); color: #fff; }
  .sources { margin-top: 14px; display: grid; gap: 8px; }
  .src { border: 1px solid var(--line); background: var(--panel); border-radius: 12px; overflow: hidden; }
  .src summary { list-style: none; cursor: pointer; padding: 10px 14px; display: flex; align-items: center; gap: 10px; font-size: 13.5px; }
  .src summary::-webkit-details-marker { display: none; }
  .src summary .num { flex-shrink: 0; width: 22px; height: 22px; border-radius: 6px; background: var(--cite-soft); color: var(--cite); font-weight: 700; font-size: 12px; display: grid; place-items: center; }
  .src summary .where { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .src summary .pg { color: var(--muted); white-space: nowrap; margin-left: auto; }
  .src[open] summary { border-bottom: 1px solid var(--line); }
  .src.flash { box-shadow: 0 0 0 2px var(--cite); }
  .src p { margin: 0; padding: 12px 14px; font-family: var(--serif); font-size: 15px; line-height: 1.6; color: var(--ink-2); white-space: pre-wrap; max-height: 220px; overflow-y: auto; }
  .thinking { display: inline-flex; gap: 5px; padding: 6px 0; }
  .thinking i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); opacity: .3; animation: blink 1.2s infinite; }
  .thinking i:nth-child(2) { animation-delay: .2s; } .thinking i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 50% { opacity: 1; } }

  /* ---------- Composer ---------- */
  .composer { padding: 12px 28px calc(18px + env(safe-area-inset-bottom)); }
  .composer-inner { max-width: 760px; margin: 0 auto; display: flex; align-items: flex-end; gap: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 8px 8px 8px 16px; box-shadow: 0 6px 24px rgba(60, 45, 20, .07); }
  .composer-inner:focus-within { border-color: var(--accent); }
  .composer textarea { flex: 1; border: 0; outline: none; resize: none; background: transparent; font-size: 16px; line-height: 1.45; padding: 8px 0; max-height: 160px; overflow-y: hidden; }
  .composer select { border: 0; background: var(--paper); border-radius: 10px; padding: 8px 6px; font-size: 13px; color: var(--ink-2); cursor: pointer; }
  .send { width: 42px; height: 42px; flex-shrink: 0; border: 0; border-radius: 12px; background: var(--accent); color: #fff; cursor: pointer; display: grid; place-items: center; }
  .send:disabled { opacity: .45; cursor: default; }
  .composer .note { max-width: 760px; margin: 6px auto 0; font-size: 12px; color: var(--muted); text-align: center; }

  .toast { position: fixed; left: 50%; top: 18px; transform: translate(-50%, -10px); background: var(--ink); color: #fbf7ee; padding: 10px 16px; border-radius: 12px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 60; max-width: calc(100vw - 32px); }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast.error { background: var(--danger); }
  .scrim { display: none; }

  /* ---------- Phones / small tablets ---------- */
  @media (max-width: 820px) {
    .app { grid-template-columns: 1fr; }
    .side { position: fixed; inset: 0 auto 0 0; width: min(86vw, 320px); z-index: 50; transform: translateX(-102%); transition: transform .22s ease; }
    .side.open { transform: none; box-shadow: 8px 0 30px rgba(0,0,0,.15); }
    .scrim { display: block; position: fixed; inset: 0; background: rgba(34, 32, 27, .35); z-index: 40; opacity: 0; pointer-events: none; transition: opacity .2s; }
    .scrim.show { opacity: 1; pointer-events: auto; }
    .menu-btn { display: grid; place-items: center; }
    .topbar { padding: 10px 14px; }
    .topbar h1 { font-size: 18px; }
    .thread { padding: 18px 14px 8px; }
    .welcome { padding-top: 3vh; }
    .welcome h2 { font-size: 25px; }
    .a .body { font-size: 16.5px; }
    .q div { max-width: 88%; }
    .composer { padding: 8px 10px calc(10px + env(safe-area-inset-bottom)); }
    .composer .note { display: none; }
    .new-row input { font-size: 16px; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="side-head">
      <div class="logo"><span class="mark"></span>Folio</div>
      <div class="tagline">Ask your documents. Every answer cites its page.</div>
    </div>
    <div class="side-label">Collections</div>
    <ul class="shelf" id="shelf"></ul>
    <div class="side-foot">
      <div class="new-row">
        <input id="newName" placeholder="New collection name" maxlength="64" autocomplete="off">
      </div>
      <label class="drop" id="drop">
        <input type="file" id="file" accept=".pdf,.txt,.md" class="hidden">
        <b id="drop-title">Add a document</b>
        <span id="drop-sub">PDF, TXT or MD · indexed into the selected collection</span>
      </label>
      <div class="side-actions">
        <span id="side-count"></span>
        <button class="link-danger" id="delete">Delete collection</button>
      </div>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <section class="main">
    <header class="topbar">
      <button class="menu-btn" id="menu" aria-label="Open collections">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      </button>
      <h1 id="title">Folio</h1>
      <span class="chip hidden" id="chunks"></span>
    </header>

    <div class="thread" id="thread"><div class="thread-inner" id="thread-inner"></div></div>

    <div class="composer">
      <form class="composer-inner" id="ask-form">
        <textarea id="question" rows="1" placeholder="Ask a question…" autocomplete="off"></textarea>
        <select id="topk" title="How many passages to read">
          <option value="3">3 src</option><option value="4" selected>4 src</option><option value="6">6 src</option><option value="8">8 src</option>
        </select>
        <button class="send" id="send" type="submit" aria-label="Ask" disabled>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
        </button>
      </form>
      <div class="note">Answers come only from your documents. Click a number like <span class="cite" style="cursor:default">1</span> to see its source.</div>
    </div>
  </section>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const NAME_RE = /^[A-Za-z0-9_-]{1,64}$/;

let collections = [];
let current = null;
let busy = false;

let toastTimer;
function toast(text, isError = false) {
  const t = $('toast');
  t.textContent = text;
  t.className = `toast show${isError ? ' error' : ''}`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = 'toast'; }, 3500);
}

async function call(path, options) {
  const res = await fetch(path, options);
  const body = await res.json().catch(() => ({}));
  if (!res.ok) {
    const d = body.detail;
    throw new Error(Array.isArray(d) ? d.map((e) => e.msg).join('; ') : d || res.statusText);
  }
  return body;
}

// ---------- collections ----------
async function loadCollections(select) {
  collections = (await call('/collections')).collections;
  if (select) current = select;
  if (!current || !collections.some((c) => c.collection_name === current)) current = collections[0]?.collection_name || null;
  renderShelf();
  renderHeader();
}

function renderShelf() {
  $('shelf').innerHTML = collections.length
    ? collections.map((c) => `<li><button class="${c.collection_name === current ? 'active' : ''}" data-col="${esc(c.collection_name)}">
        <span class="name">${esc(c.collection_name)}</span><span class="n">${c.count} chunks</span></button></li>`).join('')
    : '<li class="empty-shelf">No collections yet. Name one below and add a document.</li>';
  $('side-count').textContent = collections.length ? `${collections.length} collection${collections.length > 1 ? 's' : ''}` : '';
  $('delete').classList.toggle('hidden', !current);
}

function renderHeader() {
  const col = collections.find((c) => c.collection_name === current);
  $('title').textContent = current || 'Folio';
  $('chunks').textContent = col ? `${col.count} chunks` : '';
  $('chunks').classList.toggle('hidden', !col);
  $('send').disabled = !current || !$('question').value.trim() || busy;
  if (!$('thread-inner').querySelector('.q')) renderWelcome();
}

function renderWelcome() {
  if (!current) {
    $('thread-inner').innerHTML = `<div class="welcome"><h2>Start a library</h2>
      <p>Type a collection name in the sidebar, then add a PDF or text file. It's split into passages, embedded, and ready to question in seconds.</p></div>`;
    return;
  }
  $('thread-inner').innerHTML = `<div class="welcome"><h2>Ask “${esc(current)}”</h2>
    <p>Answers are written only from the passages retrieved from this collection, with numbered citations.</p></div>`;
}

function selectCollection(name) {
  current = name;
  $('thread-inner').innerHTML = '';
  renderShelf();
  renderHeader();
  closeDrawer();
}

// ---------- asking ----------
function renderAnswer(text) {
  // Escape first, then turn [1] / [1, 2] / [1][2] into clickable citation chips
  return esc(text)
    .replace(/\$([^$\n]{1,40})\$/g, '$1')                 // strip stray inline LaTeX markers
    .replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>')
    .replace(/\[(\d+(?:\s*,\s*\d+)*)\]/g, (_, nums) =>
      nums.split(',').map((n) => `<button class="cite" data-cite="${n.trim()}">${n.trim()}</button>`).join(''));
}

async function ask(question) {
  if (!current || busy) return;
  busy = true;
  $('send').disabled = true;
  const inner = $('thread-inner');
  if (!inner.querySelector('.q')) inner.innerHTML = '';
  const turn = document.createElement('div');
  turn.innerHTML = `<div class="q"><div>${esc(question)}</div></div>
    <div class="a"><div class="who">Folio</div><div class="thinking"><i></i><i></i><i></i></div></div>`;
  inner.appendChild(turn);
  turn.scrollIntoView({ behavior: 'smooth', block: 'start' });

  try {
    const r = await call('/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question, collection_name: current, top_k: Number($('topk').value) }),
    });
    const unknown = /^I don't know based on the provided documents/i.test(r.answer.trim());
    const sources = r.source_documents.map((s, i) => {
      const m = s.metadata || {};
      return `<details class="src" data-src="${i + 1}"><summary><span class="num">${i + 1}</span>
        <span class="where">${esc(m.source || 'unknown')}</span><span class="pg">${m.page ? `page ${m.page}` : `passage ${(m.chunk ?? i) + 1}`}</span></summary>
        <p>${esc(s.content)}</p></details>`;
    }).join('');
    turn.querySelector('.a').innerHTML = `<div class="who">Folio</div>
      <div class="body${unknown ? ' unknown' : ''}">${renderAnswer(r.answer)}</div>
      ${unknown ? '' : `<div class="sources">${sources}</div>`}`;
  } catch (e) {
    turn.querySelector('.a').innerHTML = `<div class="who">Folio</div><div class="body unknown">Couldn't answer: ${esc(e.message)}</div>`;
  }
  busy = false;
  $('send').disabled = !$('question').value.trim();
}

// ---------- uploading ----------
async function upload(file) {
  const target = $('newName').value.trim() || current;
  if (!target) return toast('Name a collection first', true);
  if (!NAME_RE.test(target)) return toast('Collection names: letters, numbers, - and _ only', true);
  const form = new FormData();
  form.append('file', file);
  $('drop-title').textContent = `Indexing ${file.name}…`;
  $('drop-sub').textContent = 'Splitting into passages and embedding';
  try {
    const r = await call(`/collections/${encodeURIComponent(target)}/documents`, { method: 'POST', body: form });
    toast(`Added ${r.chunks_added} passages to “${r.collection_name}”`);
    $('newName').value = '';
    await loadCollections(r.collection_name);
    $('thread-inner').innerHTML = '';
    renderWelcome();
  } catch (e) { toast(e.message, true); }
  $('drop-title').textContent = 'Add a document';
  $('drop-sub').textContent = 'PDF, TXT or MD · indexed into the selected collection';
  $('file').value = '';
}

// ---------- drawer (phones) ----------
function openDrawer() { $('side').classList.add('open'); $('scrim').classList.add('show'); }
function closeDrawer() { $('side').classList.remove('open'); $('scrim').classList.remove('show'); }

// ---------- events ----------
$('menu').onclick = openDrawer;
$('scrim').onclick = closeDrawer;
$('file').onchange = () => { if ($('file').files[0]) upload($('file').files[0]); };
const drop = $('drop');
['dragenter', 'dragover'].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', (e) => { if (e.dataTransfer.files[0]) upload(e.dataTransfer.files[0]); });

$('delete').onclick = async () => {
  if (!current || !confirm(`Delete the collection “${current}” and all its passages?`)) return;
  try {
    await call(`/collections/${encodeURIComponent(current)}`, { method: 'DELETE' });
    toast(`Deleted “${current}”`);
    current = null;
    $('thread-inner').innerHTML = '';
    await loadCollections();
  } catch (e) { toast(e.message, true); }
};

const q = $('question');
q.addEventListener('input', () => {
  q.style.height = 'auto';
  q.style.height = `${Math.min(q.scrollHeight, 160)}px`;
  q.style.overflowY = q.scrollHeight > 160 ? 'auto' : 'hidden';
  $('send').disabled = !current || !q.value.trim() || busy;
});
q.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('ask-form').requestSubmit(); }
});
$('ask-form').addEventListener('submit', (e) => {
  e.preventDefault();
  const text = q.value.trim();
  if (!text) return;
  q.value = '';
  q.style.height = 'auto';
  ask(text);
});

document.addEventListener('click', (e) => {
  const col = e.target.closest('[data-col]');
  if (col) return selectCollection(col.dataset.col);
  const cite = e.target.closest('[data-cite]');
  if (cite) {
    // Open and highlight the matching source card in the same answer
    const answer = cite.closest('.a');
    const card = answer && answer.querySelector(`.src[data-src="${cite.dataset.cite}"]`);
    if (card) {
      card.open = true;
      card.classList.add('flash');
      card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      setTimeout(() => card.classList.remove('flash'), 1400);
    }
  }
});

loadCollections().catch((e) => toast(e.message, true));
</script>
</body>
</html>
